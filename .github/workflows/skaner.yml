name: Skaner fundamentalny

on:
  schedule:
    - cron: "0 6 3 * *"   # 3. dnia miesiaca, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skanuj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml html5lib requests
      - run: python skaner.py
      - name: Zapisz wynik
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/skaner.html
          git diff --staged --quiet || git commit -m "Skaner $(date -u +%Y-%m-%d)"
          git push
