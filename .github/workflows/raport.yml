name: Raport miesieczny

on:
  schedule:
    - cron: "0 7 1 * *"   # 1. dnia miesiaca, 07:00 UTC
  workflow_dispatch:       # awaryjne odpalenie recznie

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas yfinance

      - run: python spx_report.py

      - name: Zapisz raport
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Raport $(date -u +%Y-%m-%d)"
          git push
